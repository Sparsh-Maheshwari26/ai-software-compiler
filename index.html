<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Software Compiler</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2c974b;
        }
        .output-container {
            margin-top: 30px;
        }
        pre {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>AI Compiler Interface</h1>
    <p>Enter your software requirements below to generate the structured JSON output.</p>

    <textarea id="promptInput" placeholder="e.g., Build a login screen with an email and password field..."></textarea>
    <br>
    <button onclick="generateJSON()">Generate JSON</button>

    <div class="output-container">
        <h2>Compiler Output:</h2>
        <pre id="jsonOutput">{
  "status": "waiting",
  "message": "Enter a prompt and click generate."
}</pre>
    </div>

    <script>
        // This JavaScript handles the button click and builds the JSON
        function generateJSON() {
            // 1. Get the text the user typed
            const userText = document.getElementById('promptInput').value;

            // 2. Stop if the box is empty
            if (userText.trim() === "") {
                alert("Please enter a prompt first!");
                return;
            }

            // 3. Create a simulated JSON object structure
            // (Later, this is where you would connect to a real Python backend)
            const simulatedResponse = {
                "compiler_status": "success",
                "timestamp": new Date().toISOString(),
                "input_received": userText,
                "parsed_data": {
                    "word_count": userText.split(" ").length,
                    "action_type": "interface_generation",
                    "estimated_complexity": "medium"
                }
            };

            // 4. Convert the object to a beautifully formatted text string
            const formattedJSON = JSON.stringify(simulatedResponse, null, 2);

            // 5. Display it on the screen
            document.getElementById('jsonOutput').textContent = formattedJSON;
        }
    </script>

</body>
</html>
